<script>
const TODAY = new Date().toLocaleDateString("en-CA");
const DEFAULT_AD_OPTIONS = ["realestate.com.au","domain.com.au","Facebook","Flyer drop","Signboard","Print brochures","Instagram"];

/* ---------- Template for a new sale ---------- */
function blankSale(info){
  const ck = (id,title,extra={}) => ({id,kind:"check",title,doneOn:null,method:"manual",...extra});
  const cond = (id,title) => ({id,kind:"condition",title,due:null,doneOn:null});
  return {
    vendor: info.vendor, address: info.address || "", startedOn: info.startedOn || TODAY,
    createdAt: new Date().toISOString(),
    stages: [
      { id:"prospecting", name:"Prospecting and appraisal", steps:[
        { id:"prospect_ack", kind:"flow", title:"Prospecting", completesOn:"appraisal_booked", flow:[
          { id:"initial_contact", t:"Initial contact", doneOn:null },
          { id:"recontact", t:"To be contacted again", doneOn:null, canRemind:true, reminder:null },
          { id:"appraisal_booked", t:"Appraisal booked", doneOn:null, canRemind:true, reminder:null } ]},
        ck("appraisal","Appraisal completed"),
        ck("cma","Comparative market analysis sent",{allowNotRequired:true}) ]},
      { id:"appointment", name:"Appointment", steps:[
        { id:"advertising", kind:"advertising", title:"Advertising", linked:null, authorised:null, lines:[] },
        ck("form6","Form 6 signed") ]},
      { id:"presale", name:"Pre-sale preparation", steps:[
        { id:"maintenance", kind:"maintenance", title:"Maintenance and repairs ready", doneOn:null, allowNotRequired:true, linked:null, authorised:null, lines:[] },
        ck("smoke","Smoke alarm compliance checked"),
        ck("disclosure","Disclosure document ready") ]},
      { id:"marketing", name:"Marketing and listing", steps:[
        mediaStep(),
        ck("listed","Property on the market") ]},
      { id:"offer", name:"Offer and contract", steps:[
        ck("offer_ack","Offer acknowledged"),
        ck("contract","Contract signed"),
        ck("contract_sent","Signed contract sent to the parties and solicitors") ]},
      { id:"initial_deposit", name:"Initial deposit", steps:[
        depositStep("init_dep") ]},
      { id:"conditions", name:"Conditions", steps:[
        cond("cooling","Cooling off"), cond("bnp","Building and pest"), cond("finance","Finance") ]},
      { id:"balance_deposit", name:"Balance deposit", steps:[
        depositStep("bal_dep") ]},
      { id:"settlement", name:"Settlement", steps:[
        commissionStep(),
        disburseStep(),
        cond("settle","Settlement") ]}
    ]
  };
}

/* ---------- App state ---------- */
let DB = null, mode = "loading";       // loading | db | local
let readOnly = false;
let sales = new Map();                 // id -> stored body
let adOptions = [...DEFAULT_AD_OPTIONS];
const DEFAULT_MAINT_OPTIONS = ["Plastering","Tiling","Painting","Air conditioning service","Plumbing","Electrical","Doors and windows","Gardening and landscaping","Pressure cleaning","Cleaning","Pest control","Handyman"];
let maintOptions = [...DEFAULT_MAINT_OPTIONS];
const DEFAULT_MEDIA_OPTIONS = ["Photography","Twilight photography","Drone photography","Drone video","Virtual tour","Floor plan","Video","Copywriting"];
let mediaOptions = [...DEFAULT_MEDIA_OPTIONS];
// Steps made of priced lines. Both share the table, dropdown and invoice; maintenance lines also tick off.
const LINE_KINDS = {
  advertising: { noun:"advertising", Noun:"Advertising", authLabel:"Authorised on Form 6 $", authWord:"authorised on the Form 6",
    invTitle:"Advertising and marketing", invNote:"Advertising authorised on your Form 6", ticks:false },
  maintenance: { noun:"maintenance", Noun:"Maintenance", authLabel:"Approved by vendor $", authWord:"approved by the vendor",
    invTitle:"Maintenance and repairs", invNote:"Maintenance approved by you", ticks:true, payer:true },
  // Photos, drone and tour: priced like advertising, with its own authorised amount and settlement agreement,
  // but the step itself is ticked off by hand when the media is ready.
  media: { noun:"media", Noun:"Media", authLabel:"Authorised $", authWord:"authorised",
    invTitle:"Photos, drone and tour", invNote:"Photos, drone and tour authorised by you", ticks:false, manual:true, settle:true, multi:true }
};
LINE_KINDS.advertising.settle = true;
// Documents keep the agency details they were made with, except the logo (large), which always comes from settings.
const agencySnap = () => { const a = clone(settings.agency || {}); delete a.logo; return a; };
const docAgency = d => ({ ...(d.agency || {}), logo: (d.agency && d.agency.logo) || (settings.agency && settings.agency.logo) || "" });
const vendorDirect = l => l.by === "vendor";
const chargeLines = st => (st.lines||[]).filter(l => !(LINE_KINDS[st.kind] && LINE_KINDS[st.kind].payer && vendorDirect(l)));
const chargeTotal = st => r2(chargeLines(st).reduce((t,l)=>t+(Number(l.cost)||0),0));
function mediaStep(){
  return { id:"media", kind:"media", title:"Photos, drone and tour ready", doneOn:null, linked:null, authorised:null, lines:[], invoices:[] };
}
// Steps whose completion reads as "Linked" rather than "Manually acknowledged"
const LINKED_STEPS = ["listed","offer_ack"];
const SERIES_DEFAULTS = { advertising:{prefix:"ADV-", next:1}, maintenance:{prefix:"MNT-", next:1}, media:{prefix:"MED-", next:1}, commission:{prefix:"COM-", next:1} };
const optsFor = kind => kind === "maintenance" ? maintOptions : kind === "media" ? mediaOptions : adOptions;
const lid = (part, sid, i) => `ln-${part}-${sid}-${i}`;
// Agency-wide settings (one shared document): trust account details and invoice numbering
let settings = { agency:{}, dueDays:7 };
function normalizeSettings(){
  settings.series = settings.series || {};
  if (!settings.series.advertising) settings.series.advertising = { prefix: settings.invoicePrefix ?? "ADV-", next: settings.nextInvoice || 1 };
  if (!settings.series.maintenance) settings.series.maintenance = clone(SERIES_DEFAULTS.maintenance);
  if (!settings.series.commission) settings.series.commission = clone(SERIES_DEFAULTS.commission);
  if (!settings.series.media) settings.series.media = clone(SERIES_DEFAULTS.media);
  delete settings.invoicePrefix; delete settings.nextInvoice;
}
/* ---------- Deposits: one step per deposit, flowing request → receipt → buyer trust receipt → solicitor letter ---------- */
const DEP_LABEL = { init_dep:"initial deposit", bal_dep:"balance deposit" };
const DEP_FLOW = [
  { k:"request",      t: L => `${cap(L)} request`,                       doc:"request" },
  { k:"receipt",      t: L => `${cap(L.replace(" deposit",""))} receipt`, doc:null },
  { k:"trustReceipt", t: () => "Buyer trust receipt sent",                doc:"trustreceipt" },
  { k:"letter",       t: () => "Solicitor letter sent",                   doc:"letter" }
];
const DOC_MARK = { request:"request", trustreceipt:"trustReceipt", letter:"letter" };
function depositStep(id){
  return { id, kind:"deposit", title: cap(DEP_LABEL[id]), expected:null, due:null, linked:null, receivedOn:null, receiptNo:"",
           marks:{ request:null, receipt:null, trustReceipt:null, letter:null }, autoReceipt:false };
}
// Older sales had a payment step plus a separate "receipt and solicitor letter sent" step; fold them together.
function migrateDeposits(b){
  let did = false;
  [["initial_deposit","init_dep","init_receipt"],["balance_deposit","bal_dep","bal_receipt"]].forEach(([gid,pid,rid])=>{
    const g = b.stages.find(x=>x.id===gid); if (!g) return;
    const pay = g.steps.find(x=>x.id===pid); if (!pay || pay.kind === "deposit") return;
    const rec = g.steps.find(x=>x.id===rid) || {};
    const n = depositStep(pid);
    Object.assign(n, { expected: pay.expected ?? null, linked: pay.linked ?? null, due: pay.due || null, receivedOn: pay.receivedOn || null,
      receiptNo: (rec.receipt && rec.receipt.no) || "", invoices: pay.invoices || [], notRequired: pay.notRequired });
    if (n.linked){ n.marks.receipt = n.receivedOn || rec.doneOn || TODAY; n.autoReceipt = true; }
    if (rec.doneOn) n.marks.trustReceipt = rec.doneOn;
    if (rec.receipt && rec.receipt.state === "sent") n.marks.letter = rec.doneOn || TODAY;
    (n.invoices||[]).forEach(d=>{ if (d.emailedOn && DOC_MARK[d.doc] && !n.marks[DOC_MARK[d.doc]]) n.marks[DOC_MARK[d.doc]] = d.emailedOn; });
    if (!n.notRequired) delete n.notRequired;
    g.steps = [n];
    did = true;
  });
  return did;
}
/* ---------- Commission at settlement ---------- */
function commissionStep(){
  return { id:"commission", kind:"commission", title:"Commission tax invoice", doneOn:null,
           salePrice:null, rate:null, rateInclGst:false, outgoings:[], invoices:[] };
}
function disburseStep(){
  return { id:"disburse", kind:"disburse", title:"Trust funds disbursed", doneOn:null, autoDone:false, disbursedOn:null, solicitorPaidOn:null };
}
// Settlement stage order: commission tax invoice, trust funds disbursed, then settlement itself last.
function migrateSettlement(b){
  const g = b.stages.find(x=>x.id==="settlement"); if (!g) return false;
  let did = false;
  const i = g.steps.findIndex(x=>x.id==="proceeds");
  if (i >= 0){ g.steps[i] = disburseStep(); did = true; }
  if (!g.steps.some(x=>x.id==="disburse")){ g.steps.push(disburseStep()); did = true; }
  const order = ["commission","disburse","settle"];
  const sorted = [...g.steps].sort((a,c)=>(order.indexOf(a.id)+99*(order.indexOf(a.id)<0)) - (order.indexOf(c.id)+99*(order.indexOf(c.id)<0)));
  if (sorted.some((x,k)=>x !== g.steps[k])){ g.steps = sorted; did = true; }
  return did;
}
// What happens to the money in trust, from the latest tax invoice (or today's figures if none has been made).
function disburseFigures(sale){
  const com = sale.stages.flatMap(g=>g.steps).find(x=>x.id==="commission");
  const inv = com && (com.invoices||[]).filter(d=>d.doc==="commission" && d.incurred).slice(-1)[0];
  const c = inv || (com && Number(com.salePrice) && Number(com.rate) ? commissionCalc(com, sale) : null);
  if (!c) return null;
  const toBuyer = c.buyerRefundTotal || 0;
  const available = r2(c.held - toBuyer);
  const retained = r2(Math.max(Math.min(c.totalAfter, available), 0));
  return { source: inv ? inv.no : "", held: c.held, toBuyer, retained,
           toVendor: r2(Math.max(-c.payable, 0)), dueFromSolicitor: r2(Math.max(c.payable, 0)) };
}
function syncDisburse(s){
  const f = disburseFigures(cur); if (!f) return;
  const ready = s.disbursedOn && (!f.dueFromSolicitor || s.solicitorPaidOn);
  if (ready && !s.doneOn){ s.doneOn = [s.disbursedOn, s.solicitorPaidOn].filter(Boolean).sort().pop(); s.autoDone = true; }
  else if (!ready && s.doneOn && s.autoDone){ s.doneOn = null; s.autoDone = false; }
}
function migrateCommission(b){
  const g = b.stages.find(x=>x.id==="settlement"); if (!g) return false;
  const i = g.steps.findIndex(x=>x.id==="commission");
  if (i < 0 || g.steps[i].kind === "commission") return false;
  g.steps[i] = commissionStep();
  return true;
}
const r2 = n => Math.round((Number(n)||0) * 100) / 100;
// Deposits held in trust, commission (GST worked out either way), outgoings, and what is left for the vendor.
function commissionCalc(s, sale){
  const steps = sale.stages.flatMap(g=>g.steps);
  const deposits = ["init_dep","bal_dep"].map(id=>steps.find(x=>x.id===id)).filter(x=>x && Number(x.linked))
    .map(x=>({ label: cap(DEP_LABEL[x.id]), amount: r2(x.linked), receiptNo: x.receiptNo || "" }));
  const held = r2(deposits.reduce((t,d)=>t+d.amount,0));
  const base = r2((Number(s.salePrice)||0) * (Number(s.rate)||0) / 100);
  let commEx, gst, commInc;
  if (s.rateInclGst){ commInc = base; gst = r2(commInc/11); commEx = r2(commInc - gst); }
  else { commEx = base; gst = r2(commEx * 0.1); commInc = r2(commEx + gst); }
  // Advertising and maintenance, read from their own sections, settled as the user chooses:
  //  deduct – taken from the deposit (full unpaid amount, or a part amount typed in)
  //  upfront – already paid, nothing to adjust
  //  refund – paid up front by the vendor or buyer and refunded at settlement out of the commission
  const sections = ADJ_SECTIONS.map(([key,label])=>{
    const st = steps.find(x=>x.id===key);
    if (!st || st.notRequired) return null;
    if (LINE_KINDS[key] && LINE_KINDS[key].settle){
      const z = adSettle(st);
      return { key, label, st, lines:z.lines, excess:z.excess, total:z.base, paid:z.paid, unpaid:z.unpaid, mode:"custom", amount:z.applied, dflt:z.unpaid,
               refundAmt:z.refund, payer:z.payer, applyNote:z.applyNote, refundNote:z.refundNote };
    }
    // Maintenance: every item is listed; what the vendor paid contractors directly counts as their payment.
    const isPayer = LINE_KINDS[key] && LINE_KINDS[key].payer;
    const total = r2(adTotal(st));
    const paid = isPayer ? r2(total - chargeTotal(st)) : r2(st.linked), unpaid = r2(Math.max(total - paid, 0));
    const a = (s.adj && s.adj[key]) || {};
    const mode = a.mode || (unpaid > 0 ? "deduct" : "upfront");
    const dflt = mode === "deduct" ? unpaid : mode === "refund" ? paid : 0;
    const amount = mode === "upfront" ? 0 : r2(a.amount ?? dflt);
    return { key, label, st, lines: total, total, paid, unpaid, mode, amount, dflt, payer: a.payer || "vendor" };
  }).filter(Boolean);
  const deductions = sections.filter(x=>(x.mode==="deduct" || x.mode==="custom") && x.amount)
    .map(x=>({desc: x.mode==="custom" ? `${x.label} applied at settlement${x.applyNote?` (${x.applyNote})`:""}`
                                      : `${x.label}${x.amount < x.unpaid ? " (agreed part)" : x.paid ? " (unpaid balance)" : ""}`, amt:x.amount}));
  const refunds = sections.filter(x=>(x.mode==="refund" && x.amount) || (x.mode==="custom" && x.refundAmt))
    .map(x=>({desc: `Refund of ${x.label.toLowerCase()} paid up front by the ${x.payer}${x.refundNote?` (${x.refundNote})`:""}`, amt: x.mode==="custom" ? x.refundAmt : x.amount, payer:x.payer,
              what: x.label.toLowerCase(), note: x.refundNote || ""}));
  const refundTotal = r2(refunds.reduce((t,r)=>t+r.amt,0));
  const buyerRefunds = refunds.filter(r=>r.payer==="buyer");
  const buyerRefundTotal = r2(buyerRefunds.reduce((t,r)=>t+r.amt,0));
  const commNet = r2(commInc - refundTotal);
  // "Other outgoings" was retired: every cost now belongs to advertising, media or maintenance.
  const outgoings = [];
  const outTotal = r2(outgoings.reduce((t,o)=>t+o.amt,0));
  const dedTotal = r2(deductions.reduce((t,o)=>t+o.amt,0));
  // The agency's tax-invoice layout: commission, plus outgoings the agency incurred, less what the sellers
  // paid up front and any agreed reimbursements, less the buyer's deposits = amount payable to the agency.
  const incurred = [], agencyMaint = [], vendorMaint = [];
  let noCharge = 0;
  sections.forEach(x=>{
    const isPayer = LINE_KINDS[x.key] && LINE_KINDS[x.key].payer;
    const items = (x.st.lines||[]).filter(l=>l.opt && Number(l.cost));
    // Maintenance gets its own groups: what the agency paid (reimbursed at settlement) and what the vendor paid directly (record only)
    if (isPayer){ items.forEach(l=>(vendorDirect(l) ? vendorMaint : agencyMaint).push({label:l.opt, amt:r2(l.cost)})); return; }
    // Only advertising and media are capped by an authorised amount; others, or no amount entered, are listed as they are.
    if (x.st.authorised == null || !(LINE_KINDS[x.key] && LINE_KINDS[x.key].settle)){ items.forEach(l=>incurred.push({label:l.opt, amt:r2(l.cost)})); return; }
    // Fill the authorised amount in table order: items inside it are (authorised), items beyond it (complimentary).
    let room = r2(x.lines);
    items.forEach(l=>{
      const amt = r2(l.cost), within = r2(Math.max(Math.min(amt, room), 0)); room = r2(room - within);
      incurred.push({label: within >= amt ? `${l.opt} (authorised)` : within > 0 ? `${l.opt} (part complimentary)` : `${l.opt} (complimentary)`, amt});
    });
    noCharge = r2(noCharge + (x.excess || 0));
  });
  outgoings.forEach(o=>incurred.push({label:o.desc, amt:o.amt}));
  // anything not authorised comes off once, as the last line under all the stated amounts
  if (noCharge) incurred.push({label:"Less: provided at no charge", amt:-noCharge, noCharge:true});
  const otherTotal = r2(incurred.reduce((t,x)=>t+x.amt,0));
  const agencyMaintTotal = r2(agencyMaint.reduce((t,x)=>t+x.amt,0));
  const vendorMaintTotal = r2(vendorMaint.reduce((t,x)=>t+x.amt,0));
  const incurredTotal = r2(otherTotal + agencyMaintTotal);
  // vendor-direct maintenance is neither charged nor credited, so it is left out of payments too
  const payments = sections.filter(x=>x.paid && !(LINE_KINDS[x.key] && LINE_KINDS[x.key].payer)).map(x=>({label:`${x.label} – received from vendor`, amt:x.paid}));
  const paymentsTotal = r2(payments.reduce((t,x)=>t+x.amt,0));
  const reimb = [];
  sections.forEach(x=>{
    const applied = (x.mode==="deduct" || x.mode==="custom") ? x.amount : 0;
    // for maintenance the vendor's direct payments cancel out their own items, so only the agency-paid part counts
    const adjust = r2(x.lines - x.paid - applied);
    if (Math.abs(adjust) > 0.004) reimb.push({label:`${x.label} – ${adjust>0?"agreed reduction":"additional charge"}${x.applyNote?` (${x.applyNote})`:""}${x.mode==="custom" && x.amount < 0 ? `, ${money(-x.amount)} refunded to the vendor` : ""}`, amt:adjust});
  });
  refunds.forEach(r=>reimb.push({label:`${cap(r.what)} – agreed refund to the ${r.payer}${r.note?` (${r.note})`:""}`, amt:r.amt}));
  const reimbTotal = r2(reimb.reduce((t,x)=>t+x.amt,0));
  const totalAfter = r2(commInc + incurredTotal - paymentsTotal - reimbTotal);
  const buyersTotal = r2(held - buyerRefundTotal);
  const payable = r2(totalAfter - buyersTotal);
  return { deposits, held, commEx, gst, commInc, sections:sections.map(({st,...x})=>x), deductions, dedTotal, refunds, refundTotal, buyerRefunds, buyerRefundTotal, commNet,
           outgoings, outTotal, balance: r2(held - commNet - dedTotal - buyerRefundTotal - outTotal),
           incurred, otherTotal, agencyMaint, agencyMaintTotal, vendorMaint, vendorMaintTotal, incurredTotal, payments, paymentsTotal, reimb, reimbTotal, totalAfter, buyersTotal, payable };
}
function commissionRows(c, o){
  const A = (o.agency || "the agency").toUpperCase(), rows = [], push = r => rows.push(r);
  push({label:"Sale price", sub:o.salePrice});
  push({label:"Commission %", subText:`${o.rate}%${o.rateInclGst?" incl. GST":""}`});
  push({label:"Total", sub:c.commEx});
  push({label:"GST 10%", sub:c.gst, rule:true});
  push({label:"Total commission inc GST", tot:c.commInc, gap:true});
  const agencyM = c.agencyMaint || [], vendorM = c.vendorMaint || [];
  const otherTot = c.otherTotal != null ? c.otherTotal : c.incurredTotal;
  if (c.incurred.length){
    push({label:`Outgoings incurred (${A})`, head:true, gap:true});
    c.incurred.forEach((x,i)=>push({label:x.label, sub:x.amt, tot: i===c.incurred.length-1 ? otherTot : undefined, rule:i===c.incurred.length-1}));
  }
  if (agencyM.length){
    push({label:`Maintenance paid by ${A} (to be reimbursed at settlement)`, head:true, gap:true});
    agencyM.forEach((x,i)=>push({label:x.label, sub:x.amt, tot: i===agencyM.length-1 ? c.agencyMaintTotal : undefined, rule:i===agencyM.length-1}));
  }
  if (c.incurred.length || agencyM.length) push({label:`Total outgoings incurred (${A})`, tot:r2(c.commInc + c.incurredTotal), bold:true});
  if (c.payments.length){
    push({label:"Payments received (sellers)", head:true, gap:true});
    c.payments.forEach((x,i)=>push({label:x.label, sub:-x.amt, rule:i===c.payments.length-1}));
    push({label:"Total payments received (sellers)", tot:-c.paymentsTotal});
  }
  if (vendorM.length){
    push({label:"Maintenance paid by vendor direct to contractors (no charge to the vendor)", head:true, gap:true, plain:true});
    vendorM.forEach((x,i)=>push({label:x.label, sub:x.amt, rule:i===vendorM.length-1}));
    push({label:"Total paid by vendor direct", mid:money(c.vendorMaintTotal), note:true});
  }
  c.reimb.forEach((x,i)=>push({label:x.label, sub:-x.amt, gap:i===0, rule:i===c.reimb.length-1}));
  push({label:`Total agreed reimbursements${c.buyerRefunds.length?"":" (sellers)"}`, tot:-c.reimbTotal, gap:!c.reimb.length, ruleAbove:!c.reimb.length});
  push({label:"Total commission after payments & receipts (inc GST)", tot:c.totalAfter, bold:true});
  push({label:"Amounts received from (buyers)", head:true, gap:true, plain:true});
  c.deposits.forEach(x=>push({label:x.label + (x.receiptNo?` (receipt ${x.receiptNo})`:""), sub:-x.amount, keepCase:true}));
  c.buyerRefunds.forEach(x=>push({label:`Refund to the buyer – ${x.what}`, sub:x.amt, keepCase:true}));
  if (rows.length) rows[rows.length-1].rule = true;
  push({label:"Total amounts received from (buyers)", tot:-c.buyersTotal, bold:true});
  push({label: c.payable >= 0 ? `Amount payable (to ${A}) on settlement:` : "Amount payable to the seller on settlement:", mid:o.settlement ? fmtNum(o.settlement) : "", tot:Math.abs(c.payable), grand:true, gap:true});
  return rows;
}
const acc = n => { const v = Math.abs(Number(n)||0).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2}); return Number(n) < 0 ? `(${v})` : v; };
// Advertising at settlement: one agreement, the vendor's share of the advertising incurred
// (all of it, a percentage, or a set amount). Compared with what the vendor paid up front, the
// difference is either payable by the vendor at settlement or refunded to them. Whatever the
// vendor doesn't bear is the agency's agreed reduction, shown under agreed reimbursements.
function adSettle(st){
  // Only advertising authorised on the Form 6 can be charged; anything above it is provided at no charge.
  const fullLines = r2(adTotal(st)), auth = st.authorised;
  const lines = auth != null ? r2(Math.min(fullLines, auth)) : fullLines, excess = r2(fullLines - lines);
  const paid = r2(st.linked), a = st.settle || {};
  const v = a.shareValue;
  let share = lines, shareNote = "";
  if (a.shareType === "percent" && v != null){ share = r2(lines * v / 100); shareNote = `vendor's share ${Number(v)}% of ${money(lines)}`; }
  else if (a.shareType === "amount" && v != null){ share = r2(Math.min(v, lines)); shareNote = `vendor's share ${money(share)} of ${money(lines)}`; }
  const reduction = r2(lines - share);
  const net = r2(share - paid);                       // + payable at settlement, − refunded at settlement
  return { lines, fullLines, excess, base: lines, paid, unpaid: r2(Math.max(lines - paid, 0)), share, reduction, net,
           atSettle: Math.max(net, 0), refund: 0, settleRefund: Math.max(-net, 0),
           applied: net, applyNote: shareNote, refundNote: "", hasApply: false, payer: "vendor", balance: net, a };
}

function migrateSale(b){
  let did = migrateDeposits(b);
  did = migrateCommission(b) || did;
  did = migrateSettlement(b) || did;
  // shrink older records: drop the copy of the logo stored inside each document
  b.stages.forEach(g=>g.steps.forEach(st=>(st.invoices||[]).forEach(d=>{ if (d.agency && d.agency.logo){ delete d.agency.logo; did = true; } })));
  b.stages.forEach(g=>g.steps.forEach((st,i)=>{
    if (st.id === "media" && st.kind !== "media"){ g.steps[i] = { ...mediaStep(), doneOn: st.doneOn || null }; did = true; }
  }));
  b.stages.forEach(g=>g.steps.forEach(st=>{
    if (st.id === "maintenance" && st.kind !== "maintenance"){
      st.kind = "maintenance";
      st.lines = (st.subtasks||[]).map(x=>({opt:x.t, cost:null, d:!!x.d}));
      delete st.subtasks; delete st.method;
      if (st.linked === undefined) st.linked = null;
      if (st.authorised === undefined) st.authorised = null;
      did = true;
    }
  }));
  return did;
}

function stable(v){ // key-order independent JSON, for change detection
  if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
  if (v && typeof v === "object") return "{" + Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",") + "}";
  return JSON.stringify(v ?? null);
}

const adTotal = s => s.lines.reduce((t,l)=>t+(Number(l.cost)||0),0);
const days = (a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function statusOf(s){
  if (s.notRequired) return "na";
  switch(s.kind){
    case "deposit": {
      if (DEP_FLOW.every(f=>s.marks && s.marks[f.k])) return "completed";
      if (s.linked && s.expected && s.linked < s.expected) return "partial";
      return "pending";
    }
    case "payment":
      if (!s.linked) return "pending";
      return s.linked >= (s.expected||0) ? "completed" : "partial";
    case "condition":
      if (s.doneOn) return "completed";
      if (!s.due) return "pending";
      return days(TODAY, s.due) < 0 ? "overdue" : "upcoming";
    case "disburse":
      return s.doneOn ? "completed" : "pending";
    case "commission":
      return s.doneOn ? "completed" : "pending";
    case "review":
      return s.reviewed ? "completed" : "review";
    case "advertising": {
      const total = adTotal(s);
      if (!s.lines.length || !s.linked) return "pending";
      return s.linked >= total ? "completed" : "partial";
    }
    case "flow":
      return s.flow.find(f=>f.id===s.completesOn).doneOn ? "completed" : "pending";
    default:
      return s.doneOn ? "completed" : "pending";
  }
}

    const card = (f) => {
      const on = m[f.k], i = f.doc ? latest(f.doc) : -1, dd = i >= 0 ? s.invoices[i] : null;

      if (dd) meta.push(`<span class="rchip ${dd.emailedOn?"r-done":dd.draftOn?"r-up":"r-today"}">${dd.emailedOn?"Emailed "+fmtDay(dd.emailedOn):dd.draftOn?"Draft in Gmail":"Not emailed"}</span>`);

      return `<div class="fstep ${on?"on":""}">
        <div class="ftop"><button class="cb ${on?"on":""}" data-act="dmark" data-k="${f.k}" data-id="${s.id}" aria-label="${on?"Undo":"Mark done"}: ${esc(f.t(L))}"></button>

        ${meta.length?`<div class="fmeta">${meta.join(" · ")}</div>`:""}</div>`;

  } else if (s.kind === "payment"){
    icon = `<span class="money" aria-hidden="true">$</span>`;
    sub.push(`Linked <span class="mono">${money(s.linked)}</span> · Expected <span class="mono">${money(s.expected)}</span>`);
    if (s.note) sub.push(esc(s.note));
    const dateField = (k,label) => `<label>${label} <input type="date" class="fld fld-date" id="fld-${s.id}-${k}" data-id="${s.id}" data-k="${k}" value="${s[k]||""}"></label>`;

        `<button class="btn small" data-act="docgen" data-t="letter" data-id="${s.id}" ${s.linked?"":"disabled"} title="${s.linked?"Create a letter to both solicitors confirming receipt":"Enter the amount received first"}">Solicitor receipt letter</button>`;
      if (!hasBuyer) sub.push(`<span style="color:var(--warn)">Add the buyer and solicitors in <button class="linkbtn" style="font-size:12px" data-act="editsale">Edit details</button> so they appear on these documents.</span>`);
    }
    nested = `<div class="nested"><div class="fields">${numField(s,"expected","Expected $")}${dateField("due","Due")}${numField(s,"linked","Received $")}${dateField("receivedOn","Received on")}</div>
      ${docListHTML(s, "Documents")}</div>`;
  } else if (s.kind === "disburse"){
    icon = `<button class="cb ${s.doneOn?"on":""}" data-act="toggle" data-id="${s.id}" aria-label="${s.doneOn?"Undo":"Mark done"}: ${esc(s.title)}"></button>`;
    const f = disburseFigures(cur);
    const dateField = (k,label) => `<label>${label} <input type="date" class="fld fld-date" id="fld-${s.id}-${k}" data-id="${s.id}" data-k="${k}" value="${s[k]||""}" ${readOnly?"disabled":""}></label>`;
    if (!f){
      sub.push(`<span style="color:var(--warn);font-weight:600">Fill in the commission tax invoice above first; this step works from its figures.</span>`);
    } else {
      sub.push(s.doneOn ? `${s.autoDone?"Completed when the funds were disbursed":"Manually acknowledged"} · <span class="mono">${s.doneOn}</span>`
        : `Ticks itself when you enter the disbursement date${f.dueFromSolicitor?" and the date the solicitor's payment arrived":""}`);
      const row = (k, v, cls="") => `<tr class="${cls}"><td>${k}</td><td class="r mono">${v}</td></tr>`;
      nested = `<div class="nested ad-box">
        <div class="sub">${f.source ? `From tax invoice <b class="mono">${esc(f.source)}</b>` : "From today's figures (no tax invoice generated yet)"}</div>

          ${row(f.toVendor ? "Balance released to the vendor" : "Balance left in trust for this sale", money(f.toVendor), "tot")}

    const c = commissionCalc(s, cur), ready = Number(s.salePrice) && Number(s.rate);

                   : `<span style="color:var(--warn);font-weight:600">To generate the tax invoice, enter the ${missing.join(" and ")} below.</span>`);

    const sumRow = (k,v,strong,subv) => `<tr${strong?' class="tot"':""}><td>${k}</td><td class="r mono sub-col">${subv??""}</td><td class="r mono">${v}</td></tr>`;
    nested = `<div class="nested ad-box">
      <div class="fields">${numField(s,"salePrice","Sale price $")}

        <label><input type="checkbox" class="fld-chk" id="fld-${s.id}-incl" data-id="${s.id}" data-k="rateInclGst" ${s.rateInclGst?"checked":""}> Rate includes GST</label></div>
      <div class="pgroup">Advertising and maintenance</div>
      ${c.sections.length ? `<div class="adj-list">` + c.sections.map(x=>{
        const idp = `adj-${x.key}`;
        if (x.mode === "custom") return `<div class="adj-row">
          <div class="adj-head"><b>${esc(x.label)}</b> <span class="sub">Total <span class="mono">${money(x.total)}</span> · Paid up front <span class="mono">${money(x.paid)}</span></span></div>
          <div class="fields"><span>${[x.lines - x.amount - x.paid > 0.004 ? `Vendor's share <span class="mono">${money(r2(x.paid + x.amount))}</span>` : "",
              x.amount > 0 ? `Payable at settlement <span class="mono">${money(x.amount)}</span>` : x.amount < 0 ? `Refunded at settlement <span class="mono">${money(-x.amount)}</span>` : "Nothing further at settlement"].filter(Boolean).join(" · ")}</span>

        return `<div class="adj-row">
          <div class="adj-head"><b>${esc(x.label)}</b> <span class="sub">Total <span class="mono">${money(x.total)}</span> · Paid up front <span class="mono">${money(x.paid)}</span> · Unpaid <span class="mono">${money(x.unpaid)}</span></span></div>
          <div class="fields">
            <label class="vh" for="${idp}-mode">How ${esc(x.label.toLowerCase())} is settled</label>
            <select class="adj-mode ad-type" style="max-width:300px" id="${idp}-mode" data-id="${s.id}" data-sec="${x.key}">
              <option value="deduct" ${x.mode==="deduct"?"selected":""}>Deduct from the deposit</option>
              <option value="upfront" ${x.mode==="upfront"?"selected":""}>Paid up front, no refund</option>

            ${x.mode==="refund" ? `<label>Paid by <select class="adj-payer ad-type" style="width:auto" id="${idp}-payer" data-id="${s.id}" data-sec="${x.key}">

            ${x.mode!=="upfront" ? `<label>${x.mode==="deduct"?"Deduct":"Refund"} $ <input class="adj-amt fld-num" id="${idp}-amt" data-id="${s.id}" data-sec="${x.key}" inputmode="decimal" value="${x.amount}" aria-label="${x.mode==="deduct"?"Amount to deduct":"Amount to refund"}"></label>
              ${x.amount !== x.dflt ? `<button class="linkbtn" style="font-size:12px" data-act="adjfull" data-id="${s.id}" data-sec="${x.key}">Use full ${money(x.dflt)}</button>` : `<span class="sub">${x.mode==="deduct"?"Full unpaid amount":"Full amount paid"}</span>`}` : ""}
          </div></div>`; }).join("") + `</div>`
        : `<div class="sub">No advertising or maintenance on this sale.</div>`}
      ${ready ? `<div class="pgroup">Breakdown</div><div class="com-wrap"><table class="com-rows"><tbody>` + commissionRows(c, {agency:(settings.agency||{}).name, salePrice:r2(s.salePrice), rate:s.rate, rateInclGst:s.rateInclGst,
          settlement:(cur.stages.flatMap(g=>g.steps).find(x=>x.id==="settle")||{}).due}).map(r=>`<tr class="${[r.head?"h":"",r.bold?"b":"",r.grand?"g":"",r.gap?"gap":""].join(" ")}">
          <td class="${r.keepCase?"":"uc"}">${esc(r.label)}</td>
          <td class="r mono s ${r.rule?"rule":""}">${r.subText ? esc(r.subText) : r.sub != null ? acc(r.sub) : (r.mid?esc(r.mid):"")}</td>
          <td class="r mono t ${r.ruleAbove?"rule-a":""}">${r.tot != null ? acc(r.tot) : ""}</td></tr>`).join("") + `</tbody></table></div>`
        : ""}
      ${docListHTML(s, "Tax invoices")}
    </div>`;
  } else if (s.kind === "review"){
    icon = `<span class="money" aria-hidden="true">$</span>`;
  } else {
    icon = `<button class="cb ${s.doneOn?"on":""}" data-act="toggle" data-id="${s.id}" aria-label="${s.doneOn?"Undo":"Mark done"}: ${esc(s.title)}"></button>`;
  }

  if (s.kind === "condition"){
    const when = s.doneOn || !s.due ? "" : (()=>{ const d = days(TODAY, s.due);
      return d<0 ? ` · <b style="color:var(--bad)">${-d} days overdue</b>` : d===0 ? " · due today" : ` · in ${d} days`; })();
    sub.push(`<span class="fields"><label>Due <input type="date" class="fld fld-date" id="fld-${s.id}-due" data-id="${s.id}" data-k="due" value="${s.due||""}"></label></span>${when}`);
    sub.push(s.doneOn ? `Manually acknowledged · <span class="mono">${s.doneOn}</span>` : "Manual acknowledgement");
  } else if (s.kind === "check"){
    const linkedStep = LINKED_STEPS.includes(s.id);
    sub.push(s.doneOn ? `${linkedStep?"Linked":"Manually acknowledged"} · <span class="mono">${s.doneOn}</span>` : linkedStep ? "Not linked yet" : "Manual acknowledgement");
    if (s.allowNotRequired && !s.doneOn) actions = `<button class="btn small" data-act="na" data-id="${s.id}">Not required for this property</button>`;
  }

  if (s.receipt){
    const r = s.receipt;
    const line = r.state==="preparing" ? `<span class="pill s-pending">Solicitor letter not sent yet</span> Generate it with “Solicitor receipt letter” on the deposit step above, then email it.` : `<span class="pill s-completed">Solicitor letter sent</span>`;

      (r.state==="preparing" ? `<div><button class="btn small" data-act="receipt" data-id="${s.id}">Mark letter sent</button></div>`
                             : `<div><button class="btn small" data-act="receiptundo" data-id="${s.id}">Undo</button></div>`) + `</div>`;
  }
  if (s.kind === "review"){
    const lines = [];
    lines.push(`<span class="${s.trust==null?"warnline":""}">Trust: ${s.trust==null?"authority and expected amount not recorded":money(s.trust)}</span>`);
    lines.push(`<span class="${s.outside==null?"warnline":""}">Outside trust: ${s.outside==null?"authority and expected amount not recorded":money(s.outside)}</span>`);
    lines.push(s.reviewed ? "Payment authority reviewed. Actual trust and outside payments are tracked separately." : "Record the payment authority and the trust and outside-trust amounts, then mark it reviewed.");
    nested += `<div class="nested"><div class="notes">${lines.join("")}</div>` +
      (s.reviewed ? `<div><button class="btn small" data-act="unreview" data-id="${s.id}">Reopen review</button></div>` : `<form class="amt-form" data-review="${s.id}">
        <label for="tr-${s.id}">Trust</label><input id="tr-${s.id}" inputmode="decimal" placeholder="0.00" value="${s.trust??""}">
        <label for="ou-${s.id}">Outside</label><input id="ou-${s.id}" inputmode="decimal" placeholder="0.00" value="${s.outside??""}">
        <button class="btn small" type="submit">Save and mark reviewed</button></form>`) + `</div>`;
  }

  return `<div class="item"><div class="icon">${icon}</div>
    <div class="body"><div class="title">${esc(s.title)} <span class="pill s-${st}">${LABEL[st]}</span></div>
    ${sub.map(x=>`<div class="sub">${x}</div>`).join("")}</div>
    <div class="actions">${actions}</div>${nested}</div>`;
}

/* ---------- Render page ---------- */
const $ = id => document.getElementById(id);
function sortedSales(){ return [...sales.entries()].sort((a,b)=>String(b[1].createdAt||"").localeCompare(String(a[1].createdAt||""))); }

// Redraws replace the page's HTML. If someone is typing in a box at that moment, put back what they
// typed, the cursor and the focus, so a background refresh never wipes an unsaved entry.
function keepTyping(fn){
  const el = document.activeElement;
  const typing = el && el.id && ((el.tagName === "INPUT" && !/^(checkbox|radio|button|submit|file)$/.test(el.type)) || el.tagName === "TEXTAREA");
  const saved = typing ? { id: el.id, value: el.value, a: el.selectionStart, b: el.selectionEnd } : null;
  fn();
  if (!saved) return;
  const n = document.getElementById(saved.id);
  if (!n || n === el) return;
  if (n.value !== saved.value) n.value = saved.value;
  n.focus({preventScroll:true});
  try { if (saved.a != null) n.setSelectionRange(saved.a, saved.b); } catch {}
}
function renderChrome(){ keepTyping(renderChromeNow); }
function renderChromeNow(){
  // save indicator
  const ss = $("savestate");
  const txt = {saving:"Saving…", saved:"All changes saved", error:"Not saved"}[saveState] || (mode==="db" ? "Saved automatically" : "");
  ss.className = "savestate" + (saveState==="saving"?" busy":saveState==="error"?" err":"");
  ss.innerHTML = txt ? `<span class="d"></span>${txt}` : "";

  // picker
  const pick = $("sale-pick");
  const list = sortedSales();
  pick.hidden = list.length < 1;
  pick.innerHTML = list.map(([id,b])=>`<option value="${esc(id)}" ${id===curId?"selected":""}>${esc(saleLabel(b))}</option>`).join("");
  $("new-btn").hidden = readOnly || mode==="loading";
  $("agency-btn").hidden = readOnly || mode==="loading";
  $("overlay").innerHTML = overlayHTML();

  // banner
  let b = notice;
  if (!b && mode==="local" && window.DEMO_SETUP) b = "Demo with a sample sale. Try anything you like: changes aren't saved, and reloading the page starts again.";
  if (!b && mode==="local") b = "Saving isn't available in this view, so changes last only until you close the page. Open the artifact from claude.ai to keep your work.";
  if (!b && readOnly) b = "You can view these sales, but you don't have access to change them.";
  $("banner").innerHTML = b ? `<div class="banner${notice?" bad":""}">${esc(b)}</div>` : "";

  // panel (new / edit / delete)
  $("panel").innerHTML = panelHTML();
}

function render(){ keepTyping(renderNow); }
function renderNow(){
  renderChrome();
  const meta = $("meta"), main = $("main"), empty = $("empty");

  if (mode === "loading"){
    main.hidden = true; meta.innerHTML = "";
    empty.innerHTML = `<div class="empty"><span><span class="spin" aria-hidden="true"></span>Loading your sales…</span></div>`;
    return;
  }
  if (!cur){
    main.hidden = true; meta.innerHTML = "";
    empty.innerHTML = panel ? "" : `<div class="empty"><b>No sales yet</b><span>Each property you're selling gets its own timeline, from first contact through to settlement.</span>
      ${readOnly?"":`<button class="btn primary" data-act="newsale">+ Start a sale</button>`}</div>`;
    return;
  }
  empty.innerHTML = ""; main.hidden = false;

  const all = cur.stages.flatMap(g=>g.steps.map(s=>({s,st:statusOf(s)})));
  const live = all.filter(x=>x.st!=="na");
  const done = live.filter(x=>x.st==="completed").length;
  const attn = live.filter(x=>needsAttention(x.st)).length;
  const settle = all.find(x=>x.s.id==="settle").s;
  const nextRem = cur.stages.flatMap(g=>g.steps).filter(s=>s.flow).flatMap(s=>s.flow)
    .filter(f=>f.reminder && !f.doneOn).sort((a,b)=>(a.reminder.on+a.reminder.time).localeCompare(b.reminder.on+b.reminder.time))[0];
  const firstOpen = cur.stages.find(g=>g.steps.some(s=>!["completed","na"].includes(statusOf(s))));

  meta.innerHTML = `
    <span>Pipeline: <span class="pipeline">${esc(firstOpen ? firstOpen.name : "Settled")}</span></span>
    ${cur.address?`<span>Property <b>${esc(cur.address)}</b></span>`:""}
    <span>Vendor <b>${esc(cur.vendor)}</b>${cur.vendorEmail?` · <span class="mono">${esc(cur.vendorEmail)}</span>`:""}</span>
    ${cur.buyer && cur.buyer.name ? `<span>Buyer <b>${esc(cur.buyer.name)}</b></span>` : ""}
    <span>Started <span class="mono">${esc(fmtDate(cur.startedOn))}</span></span>
    ${readOnly?"":`<button class="linkbtn" data-act="editsale">Edit details</button>`}`;

  const toSettle = settle.doneOn ? "Done" : settle.due ? days(TODAY,settle.due)+" days" : "No date";
  $("stats").innerHTML = `
    <div class="stat"><span class="n">${done}/${live.length}</span><span class="l">Steps done</span></div>
    <div class="stat"><span class="n">${attn}</span><span class="l">Need attention</span></div>
    <div class="stat"><span class="n">${toSettle}</span><span class="l">To settlement${settle.due?" · "+settle.due:""}</span></div>
    <div class="stat"><span class="n">${nextRem?fmtDay(nextRem.reminder.on):"None"}</span><span class="l">Next reminder${nextRem?" · "+esc(nextRem.t):""}</span></div>
    <div class="stat"><span class="n">${firstOpen?esc(firstOpen.name):"—"}</span><span class="l">Current stage</span></div>`;

  $("rail").innerHTML = cur.stages.map(g=>{
    const ls = g.steps.map(statusOf).filter(x=>x!=="na");
    const p = ls.length ? ls.filter(x=>x==="completed").length/ls.length : 1;
    const a = ls.some(needsAttention);
    return `<span class="${a?"attn":""}" title="${esc(g.name)}: ${Math.round(p*100)}%" data-jump="${g.id}"><i style="transform:scaleX(${p})"></i></span>`;
  }).join("");

  const na = all.filter(x=>x.st==="na");
  $("na").innerHTML = na.length ? `<details class="na-box" id="na-d" ${openDetails.has("na-d")?"open":""}><summary>Not required (${na.length})</summary>` +
    na.map(x=>`<div class="na-row"><span>${esc(x.s.title)}</span><button class="btn small" data-act="restore" data-id="${x.s.id}">Restore</button></div>`).join("") + `</details>` : "";

  $("stages").innerHTML = cur.stages.map(g=>{
    const rows = g.steps.map(s=>({s,st:statusOf(s)})).filter(x=>x.st!=="na")
      .filter(x=> filter==="all" || (filter==="open" && x.st!=="completed") || (filter==="attn" && needsAttention(x.st)));
    if (!rows.length && filter!=="all") return "";
    const ls = g.steps.map(statusOf).filter(x=>x!=="na");
    const c = ls.filter(x=>x==="completed").length;
    const cls = [c===ls.length?"done":"", ls.some(needsAttention)?"attn":"", closed.has(g.id)?"closed":""].join(" ");
    return `<section class="stage ${cls}" id="g-${g.id}">
      <button class="stage-h" data-act="fold" data-id="${g.id}" aria-expanded="${!closed.has(g.id)}">
        <span class="dot"></span><h2>${esc(g.name)}</h2><span class="cnt">${c}/${ls.length}</span><span class="chev">▾</span></button>
      <div class="items">${rows.map(x=>stepHTML(x.s,x.st)).join("")}</div></section>`;
  }).join("");

  $("json").textContent = JSON.stringify({id:curId, ...cur}, null, 2);
}

    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await Promise.all([...box.querySelectorAll("img")].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));

// Shrink an uploaded logo so it stores comfortably with the agency settings.
function pickLogo(input){
  const file = input.files && input.files[0]; if (!file) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const scale = Math.min(1, 600 / img.width, 200 / img.height);
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    logoDraft = c.toDataURL("image/png");
    const im = $("ag-logo-preview"); if (im){ im.src = logoDraft; im.hidden = false; }
    const rm = $("ag-logo-clear"); if (rm) rm.hidden = false;
  };
  img.onerror = () => { URL.revokeObjectURL(url); notice = "That file couldn't be read as an image. Try a PNG or JPG."; renderChrome(); };
  img.src = url;
}

/* ---------- Saving ---------- */
let saveTimer = null, saving = null, again = false;
function changed(){
  render();
  if (readOnly) return;
  if (mode === "local"){ sales.set(curId, clone(cur)); return; }
  saveState = "saving"; renderChrome();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 600);
}
async function flush(){
  clearTimeout(saveTimer); saveTimer = null;
  if (mode !== "db" || !cur) return;
  if (saving){ again = true; return saving; }
  const id = curId, body = clone(cur);
  saving = (async()=>{
    try {
      await DB.collection("sales").doc(id).set(body);
      sales.set(id, body);
      if (id === curId) curKey = stable(body);
      saveState = "saved"; notice = "";
    } catch(e){ onWriteError(e); }
  })();
  await saving; saving = null;
  if (again){ again = false; return flush(); }
  renderChrome();
}
function onWriteError(e){
  saveState = "error";
  const code = e && e.code;
  if (code === "invalid_argument"){ readOnly = true; notice = ""; }
  else if (code === "quota_exceeded") notice = "Storage for this tracker is full. Delete a finished sale to make room, then try again.";
  else if (code === "revoked") notice = "Access to this tracker changed. Reload the page to keep working.";
  else notice = "Your last change didn't save. Check your connection; the next change will try again.";
  render();
}
const pendingSave = () => !!saveTimer || !!saving;

async function selectSale(id){
  if (pendingSave()) await flush();

  cur = b ? clone(b) : null;

  editing = null; closed.clear(); viewInv = null; mailOpen = false;
  if (id) lsSet("pt-current", id);
  if (cur && migrateSale(cur)) return changed();
  render();
}

// Shared settings save: one write at a time, the latest state wins, and a failure is shown, never swallowed.
let settingsBusy = false, settingsAgain = false;
async function saveSettings(){
  if (mode !== "db" || readOnly) return;
  if (settingsBusy){ settingsAgain = true; return; }
  settingsBusy = true;
  try {
    do {
      settingsAgain = false;
      const body = clone({...settings, adOptions, maintOptions, mediaOptions});
      delete body.invoicePrefix; delete body.nextInvoice;
      await DB.doc("settings/agency").set(body);
      settingsKey = stable(body);
    } while (settingsAgain);
  } catch(e){
    saveState = "error";
    notice = "A change to your agency settings or type lists didn't save" + (e && e.code ? ` (${e.code})` : "") + ". Reload the page and try again.";
    render();
  } finally { settingsBusy = false; }
}

function addMediaType(s){
  const inp = $("mx-new"), name = inp && inp.value.trim();
  if (!name) return inp && inp.focus();
  const list = optsFor(s.kind), existing = list.find(o=>o.toLowerCase()===name.toLowerCase()) || s.lines.map(l=>l.opt).find(o=>o && o.toLowerCase()===name.toLowerCase());
  const o = existing || name;
  if (!list.includes(o)){ list.push(o); saveSettings(); }
  if (!s.lines.some(l=>l.opt===o)) s.lines.push({opt:o, cost:null});
  changed();
  const c = document.querySelector(`.mx-cost[data-opt="${CSS.escape(o)}"]`); c && c.focus();
}
// When every item on a tick-off list (maintenance) is ticked, the step completes itself.
// If it completed that way and an item is later unticked or added, it reopens.
// A step ticked by hand is left alone.
function syncLines(s){
  if (!LINE_KINDS[s.kind] || !LINE_KINDS[s.kind].ticks) return;
  const named = s.lines.filter(l=>l.opt);
  const allDone = named.length > 0 && named.every(l=>l.d);
  if (allDone && !s.doneOn){ s.doneOn = TODAY; s.autoDone = true; }
  else if (!allDone && s.doneOn && s.autoDone){ s.doneOn = null; s.autoDone = false; }
}

  if (f.dataset.rem){
    const [id,i] = f.dataset.rem.split("|");
    find(id).flow[+i].reminder = { on: $("rem-date").value, time: $("rem-time").value, note: $("rem-note").value.trim() };
    editing = null; return changed();
  }
  if (f.dataset.review){
    const s = find(f.dataset.review);
    s.trust = num($("tr-"+s.id).value); s.outside = num($("ou-"+s.id).value);
    if (s.trust==null && s.outside==null) return render();
    s.reviewed = true; changed();
  }
});
$("expand").onclick = ()=>{ closed.clear(); render(); };
$("collapse").onclick = ()=>{ cur.stages.forEach(g=>{ if(g.steps.every(s=>["completed","na"].includes(statusOf(s)))) closed.add(g.id); }); render(); };
$("copy").onclick = e=>{
  navigator.clipboard?.writeText($("json").textContent).then(()=>e.target.textContent="Copied",()=>{
    const r=document.createRange(); r.selectNodeContents($("json")); getSelection().removeAllRanges(); getSelection().addRange(r);
  });
};

/* ---------- Boot ---------- */
normalizeSettings();
render();
(async()=>{
  let db = null, user = null;
  try {
    if (window.claude && window.claude.use) [db, user, DL] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  } catch {}
  try {
    const mcp = window.claude && window.claude.use ? await claude.use("mcp") : null;
    if (mcp) GMAIL = { createDraft: async ({to, subject, text, html}) => {
      const r = await mcp.callTool("Gmail", "create_draft", { to: Array.isArray(to) ? to : [to], subject, body:text, htmlBody:html, includeSignature:true });
      return r && r.payload;
    }};
  } catch {}
  if (!db){ mode = "local"; if (window.DEMO_SETUP) window.DEMO_SETUP(); return render(); }
  DB = db; mode = "db";
  if (user){ try { if (await user.can("data.write") === false) readOnly = true; } catch {} }

  const onErr = err => { if (err && err.code === "revoked"){ notice = "Access to this tracker changed. Reload the page to keep working."; render(); } };

  db.doc("settings/agency").onSnapshot(snap=>{
    const d = snap.exists ? snap.data() : null;
    if (!d) return;
    if (settingsBusy) return;              // our own save is in flight; its result arrives next
    const before = stable({...settings, adOptions, maintOptions, mediaOptions});
    if (Array.isArray(d.adOptions)) adOptions = [...d.adOptions];
    if (Array.isArray(d.maintOptions)) maintOptions = [...d.maintOptions];
    if (Array.isArray(d.mediaOptions)) mediaOptions = [...d.mediaOptions];
    if (!d.series) delete settings.series;   // let older numbering settings carry over
    settings = { ...settings, ...clone(d) }; delete settings.adOptions; delete settings.maintOptions; delete settings.mediaOptions;
    settings.agency = settings.agency || {};
    normalizeSettings();
    if (stable({...settings, adOptions, maintOptions, mediaOptions}) !== before && panel !== "agency") render();
  }, onErr);

  let first = true, listKey = "";
  db.collection("sales").onSnapshot(snap=>{
    const next = new Map();
    snap.docs.forEach(d=>next.set(d.id, d.data()));
    // keep a sale we just created locally until the store confirms it
    if (curId && !next.has(curId) && sales.has(curId) && pendingSave()) next.set(curId, sales.get(curId));
    sales = next;
    const newListKey = stable(sortedSales().map(([id,b])=>[id,saleLabel(b)]));

    if (first){
      first = false;
      // Panda Realty: opened from a property, so show (or start) that property's sale.
      const qp = new URLSearchParams(location.search), want = qp.get("sale");
      if (want){
        listKey = newListKey;
        if (!sales.has(want)){
          const body = blankSale({ vendor: qp.get("vendor") || "Vendor", address: qp.get("address") || "" });
          body.vendorEmail = qp.get("email") || "";
          body.propertyListId = qp.get("property") || null;
          sales.set(want, body);
          saveState = "saving"; renderChrome();
          DB.collection("sales").doc(want).set(body).then(()=>{ saveState = "saved"; renderChrome(); }, onWriteError);
        }
        return selectSale(want);
      }
      const saved = lsGet("pt-current");
      const pickId = saved && sales.has(saved) ? saved : (sortedSales()[0]||[])[0] || null;
      listKey = newListKey;
      return selectSale(pickId);
    }
    let redraw = newListKey !== listKey; listKey = newListKey;
    if (curId && !sales.has(curId)){ // deleted elsewhere
      const nx = sortedSales()[0]; return selectSale(nx ? nx[0] : null);
    }
    if (!curId && sales.size){ return selectSale(sortedSales()[0][0]); }
    if (curId && !pendingSave()){
      const incoming = sales.get(curId), k = stable(incoming);
      if (k !== curKey){ cur = clone(incoming); curKey = k; redraw = true;
        if (migrateSale(cur)) return changed(); }
    }
    if (redraw) render();
  }, onErr);
})();
</script>
